
name: Build NutriMedi Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -name "NutriMedi_Mobile_App.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          cd extracted/nutrimedi-app
          npm install

      - name: Repair Expo publication config
        run: |
          python3 - <<'PY'
          import os,json

          root="extracted/nutrimedi-app/node_modules"

          for current,dirs,files in os.walk(root):
              if "expo-module.config.json" not in files:
                  continue

              cp=os.path.join(current,"expo-module.config.json")
              pp=os.path.join(current,"package.json")

              try:
                  with open(cp) as f:
                      config=json.load(f)
                  with open(pp) as f:
                      package=json.load(f)

                  changed=False

                  for module in config.get("modules",[]):
                      for project in module.get("projects",[]):
                          pub=project.get("publication")
                          if isinstance(pub,dict) and not pub.get("version"):
                              pub["version"]=package.get("version","1.0.0")
                              changed=True

                  for project in config.get("android",{}).get("projects",[]):
                      pub=project.get("publication")
                      if isinstance(pub,dict) and not pub.get("version"):
                          pub["version"]=package.get("version","1.0.0")
                          changed=True

                  if changed:
                      with open(cp,"w") as f:
                          json.dump(config,f,indent=2)
                      print("Repaired:",package.get("name"))

              except Exception as e:
                  print("Skipped:",cp,e)
          PY

      - name: Generate Android project
        run: |
          cd extracted/nutrimedi-app
          npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          cd extracted/nutrimedi-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriMedi-APK
          path: extracted/nutrimedi-app/android/app/build/outputs/apk/debug/app-debug.apk
