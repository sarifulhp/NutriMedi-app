
name: Build NutriMedi Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NutriMedi ZIP
        run: |
          ZIP=$(find . -name "NutriMedi_Mobile_App.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "NutriMedi ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Locate Expo project
        run: |
          PROJECT_DIR=$(find extracted -name package.json -not -path "*/node_modules/*" | while read f; do
            if grep -q '"expo"' "$f"; then
              dirname "$f"
              break
            fi
          done)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Expo project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Prepare EAS APK configuration
        run: |
          cd "$PROJECT_DIR"

          node -e '
          const fs = require("fs");
          const file = "eas.json";
          let config = fs.existsSync(file)
            ? JSON.parse(fs.readFileSync(file, "utf8"))
            : {};

          config.cli = config.cli || {};
          config.cli.version = config.cli.version || ">= 16.0.0";

          config.build = config.build || {};
          config.build.preview = config.build.preview || {};
          config.build.preview.android = config.build.preview.android || {};
          config.build.preview.android.buildType = "apk";

          fs.writeFileSync(file, JSON.stringify(config, null, 2));
          '

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK with Expo EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd "$PROJECT_DIR"
          eas build --platform android --profile preview --non-interactive
